<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SNShop - Iniciar sesión</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #13142A; color: #ECECEC; font-family: 'Poppins', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .container {
    background: #1E1E3F; padding: 40px 50px; border-radius: 16px;
    width: 320px; box-shadow: 0 0 20px rgb(219 0 255 / 0.3);
  }
  .logo {
    text-align: center;
    margin-bottom: 30px;
  }
  .logo a {
    font-weight: 900;
    font-size: 1.8rem;
    color: #FF6D05;
    text-decoration: none;
  }
  .logo span { color: #DB00FF; }
  h2 {
    margin-bottom: 1.4em;
    font-weight: 700;
    color: #FF6D05;
    text-align: center;
  }
  form { display: flex; flex-direction: column; gap: 1em; }
  .mensaje {
    margin-top: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 20px;
    text-align: center;
  }
  .mensaje.error { color: #ff7b7b; }
  .mensaje.ok { color: #7CFFB2; }
  label {
    font-size: 0.9rem;
    font-weight: 600;
    color: #ECECEC;
  }
  input[type="email"], input[type="password"] {
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    background: #22224A;
    color: #ECECEC;
    font-size: 1rem;
    outline: none;
    transition: outline 0.3s;
  }
  input[type="email"]:focus, input[type="password"]:focus {
    outline: 2px solid #FF6D05;
  }
  input::placeholder { color: #7777a7; }
  .btn-primary {
    background: linear-gradient(90deg, #FF6D05, #DB00FF);
    padding: 14px 0;
    border-radius: 40px;
    font-weight: 900;
    font-size: 1rem;
    cursor: pointer;
    border: none;
    color: white;
    box-shadow: 0 4px 15px rgb(219 0 255 / 0.7);
    transition: all 0.3s ease;
    margin-top: 10px;
  }
  .btn-primary:hover {
    filter: brightness(1.2);
    transform: translateY(-3px);
  }
  .links {
    margin-top: 1.5em;
    font-size: 0.85rem;
    text-align: center;
    color: #9999CC;
  }
  .links a {
    color: #FF6D05;
    font-weight: 600;
    text-decoration: none;
  }
  .links a:hover { text-decoration: underline; }
  .btn-volver {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #9999CC;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .btn-volver:hover { color: #FF6D05; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <a href="index.html">SN<span>SHOP</span></a>
  </div>
  
  <h2>Iniciar sesión</h2>
  
  <form id="loginForm">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="tucorreo@email.com" required />
    
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="********" required />
    
    <button type="submit" class="btn-primary">Iniciar sesión</button>
  </form>

  <div id="mensaje" class="mensaje"></div>
  
  <div class="links">
    ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
  </div>
  
  <a href="index.html" class="btn-volver">← Volver al inicio</a>
</div>

<script>
  const form = document.getElementById('loginForm');
  const mensaje = document.getElementById('mensaje');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    mensaje.textContent = '';
    mensaje.className = 'mensaje';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('http://localhost:3000/api/usuarios/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        mensaje.textContent = data.error || 'No se pudo iniciar sesión';
        mensaje.classList.add('error');
        return;
      }

      mensaje.textContent = data.mensaje || 'Inicio de sesión exitoso';
      mensaje.classList.add('ok');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 900);
    } catch (error) {
      mensaje.textContent = 'No se pudo conectar con el servidor';
      mensaje.classList.add('error');
    }
  });
</script>
</body>
</html>
