<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SNShop - Regístrate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #13142A; color: #ECECEC; font-family: 'Poppins', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .container {
    background: #1E1E3F; padding: 40px 50px; border-radius: 16px;
    width: 340px; box-shadow: 0 0 20px rgb(219 0 255 / 0.3);
  }
  .logo {
    text-align: center;
    margin-bottom: 30px;
  }
  .logo a {
    font-weight: 900;
    font-size: 1.8rem;
    color: #FF6D05;
    text-decoration: none;
  }
  .logo span { color: #DB00FF; }
  h2 {
    margin-bottom: 1.4em;
    font-weight: 700;
    color: #FF6D05;
    text-align: center;
  }
  form { display: flex; flex-direction: column; gap: 1em; }
  label {
    font-size: 0.9rem;
    font-weight: 600;
    color: #ECECEC;
  }
  input[type="text"], input[type="email"], input[type="password"] {
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    background: #22224A;
    color: #ECECEC;
    font-size: 1rem;
    outline: none;
    transition: outline 0.3s;
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
    outline: 2px solid #FF6D05;
  }
  input::placeholder { color: #7777a7; }
  .btn-primary {
    background: linear-gradient(90deg, #FF6D05, #DB00FF);
    padding: 14px 0;
    border-radius: 40px;
    font-weight: 900;
    font-size: 1rem;
    cursor: pointer;
    border: none;
    color: white;
    box-shadow: 0 4px 15px rgb(219 0 255 / 0.7);
    transition: all 0.3s ease;
    margin-top: 10px;
  }
  .btn-primary:hover {
    filter: brightness(1.2);
    transform: translateY(-3px);
  }
  .links {
    margin-top: 1.5em;
    font-size: 0.85rem;
    text-align: center;
    color: #9999CC;
  }
  .links a {
    color: #FF6D05;
    font-weight: 600;
    text-decoration: none;
  }
  .links a:hover { text-decoration: underline; }
  .btn-volver {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #9999CC;
    font-size: 0.9rem;
    text-decoration: none;
  }
  .btn-volver:hover { color: #FF6D05; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <a href="index.html">SN<span>SHOP</span></a>
  </div>
  
  <h2>Crear cuenta</h2>
  
  <form id="registroForm">
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" placeholder="Tu nombre completo" required />
    
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="tucorreo@email.com" required />
    
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="********" required />
    
    <label for="confirmar">Confirmar contraseña</label>
    <input type="password" id="confirmar" placeholder="********" required />
    
    <button type="submit" class="btn-primary">Registrarse</button>
  </form>
  <p id="mensajeRegistro" style="margin-top:12px; font-size:0.9rem;"></p>
  
  <div class="links">
    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
  </div>
  
  <a href="index.html" class="btn-volver">← Volver al inicio</a>
</div>

<script>
  const form = document.getElementById('registroForm');
  const mensaje = document.getElementById('mensajeRegistro');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
      nombre: document.getElementById('nombre').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      confirmar: document.getElementById('confirmar').value
    };

    try {
      const response = await fetch('http://localhost:3000/api/usuarios/registro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (!response.ok) {
        mensaje.style.color = '#ff6b6b';
        mensaje.textContent = result.error || 'No se pudo registrar el usuario';
        return;
      }

      mensaje.style.color = '#8cff98';
      mensaje.textContent = result.mensaje || 'Registro exitoso';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    } catch (error) {
      mensaje.style.color = '#ff6b6b';
      mensaje.textContent = 'Error de conexión con el servidor';
      console.error(error);
    }
  });
</script>
</body>
</html>
