<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SNShop - Productos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
  body {
    margin:0; background:#13142A; color:#ECECEC; font-family:'Poppins', sans-serif;
    padding: 90px 40px 40px 40px;
  }
  header {
    position: fixed; top:0; left:0; right:0; height:60px; background:#141530; display:flex; align-items:center; justify-content:space-between; padding:0 50px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.7); z-index: 1000;
  }
  .logo {
    font-weight:900; font-size:1.5rem; color:#FF6D05;
    user-select:none;
  }
  nav ul {
    list-style:none; display:flex; gap:1.8rem; margin:0; padding:0;
  }
  nav ul li {
    font-weight:500; font-size:1rem; cursor:pointer;
    color:#ECECEC;
  }
  nav ul li:hover {
    color:#FF6D05;
  }
  .search {
    background:#22224A; border-radius:25px; padding:5px 15px; display:flex; align-items:center; gap:0.6rem;
    width:250px;
  }
  .search input {
    background:transparent; border:none; outline:none; color:#ECECEC; width:100%; font-size:0.9rem;
  }
  .search svg {
    fill:#9999CC;
  }
  .filters {
    margin: 40px 0 20px 0;
    display: flex; gap: 20px; flex-wrap: wrap;
  }
  .filter-group {
    background: #22224A;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.9rem;
    color: #ECECEC;
    cursor: pointer;
    user-select:none;
  }
  .products-grid {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
  }
  .product-card {
    background: #1B1B35;
    border-radius: 18px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 0 10px rgb(219 0 255 / 0.3);
    transition: transform 0.3s ease;
  }
  .product-card:hover {
    transform: translateY(-5px);
  }
  .product-img img {
    width: 100%;
    border-radius: 12px;
    object-fit: contain;
    height: 160px;
    background: #2B2B54;
  }
  .product-name {
    font-weight: 600;
    font-size: 1.1rem;
  }
  .product-price {
    font-weight: 900;
    font-size: 1.2rem;
    color: #FF6D05;
  }
  .product-rating {
    color: #FFD700;
    display: flex;
    gap: 2px;
  }
  .icon-button {
    background: linear-gradient(45deg, #FF6D05, #DB00FF);
    border: none;
    padding: 8px 16px;
    border-radius: 30px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: auto;
    transition: filter 0.3s;
  }
  .icon-button:hover {
    filter: brightness(1.2);
  }
</style>
</head>
<body>

<header>
  <div class="logo">SN<span style="color:#DB00FF">SHOP</span></div>
  <nav>
    <ul>
      <li>Inicio</li>
      <li>Categorías</li>
      <li>Ofertas</li>
      <li>Novedades</li>
      <li>Nosotros</li>
      <li>Contacto</li>
    </ul>
  </nav>
  <div class="search">
    <input type="text" placeholder="Buscar productos...">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M21.53 20.47l-4.825-4.825A7.944 7.944 0 0016 10a8 8 0 10-8 8 7.944 7.944 0 005.645-2.295l4.825 4.825a.75.75 0 001.06-1.06zM10 16a6 6 0 110-12 6 6 0 010 12z" fill="currentColor"/></svg>
  </div>
</header>

<main>
  <div class="filters">
    <div class="filter-group">Todas</div>
    <div class="filter-group">Tecnología</div>
    <div class="filter-group">Moda</div>
    <div class="filter-group">Deportes</div>
    <div class="filter-group">Belleza</div>
    <div class="filter-group">Hogar</div>
  </div>

  <section class="products-grid" aria-label="Productos disponibles">
    <article class="product-card">
      <div class="product-img"><img src="https://i.imgur.com/mzpqLMU.png" alt="Audífonos Inalámbricos Pro"></div>
      <h3 class="product-name">Audífonos Inalámbricos Pro</h3>
      <div class="product-price">$159.99</div>
      <div class="product-rating" aria-label="Calificación cinco estrellas">
        &#9733;&#9733;&#9733;&#9733;&#9734;
      </div>
      <button class="icon-button" aria-label="Agregar Audífonos Inalámbricos Pro al carrito">Agregar</button>
    </article>

    <article class="product-card">
      <div class="product-img"><img src="https://i.imgur.com/1VlgkVw.png" alt="Smartwatch Series 8"></div>
      <h3 class="product-name">Smartwatch Series 8</h3>
      <div class="product-price">$129.99</div>
      <div class="product-rating">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
      <button class="icon-button" aria-label="Agregar Smartwatch Series 8 al carrito">Agregar</button>
    </article>

    <article class="product-card">
      <div class="product-img"><img src="https://i.imgur.com/Hcu6z9U.png" alt="Mochila Urbana Azul"></div>
      <h3 class="product-name">Mochila Urbana Azul</h3>
      <div class="product-price">$34.99</div>
      <div class="product-rating">&#9733;&#9733;&#9733;&#9734;&#9734;</div>
      <button class="icon-button" aria-label="Agregar Mochila Urbana Azul al carrito">Agregar</button>
    </article>
  </section>
</main>

</body>
</html>
