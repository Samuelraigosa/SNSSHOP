<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SNShop - Productos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  :root {
    --color-dark: #0b0d29;
    --color-pink: #db00ff;
    --color-orange: #ff6d05;
  }
  body {
    margin: 0;
    background: #13142A;
    color: #ECECEC;
    font-family: 'Poppins', sans-serif;
    padding-top: 70px;
    padding-bottom: 40px;
  }
  a { text-decoration: none; color: inherit; }
  
  /* Header */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: #141530;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 50px;
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.7);
    z-index: 1000;
  }
  .logo {
    font-weight: 900;
    font-size: 1.5rem;
    color: #FF6D05;
  }
  .logo span { color: #DB00FF; }
  nav ul {
    list-style: none;
    display: flex;
    gap: 1.8rem;
    margin: 0;
    padding: 0;
  }
  nav ul li {
    font-weight: 500;
    font-size: 1rem;
    cursor: pointer;
    color: #ECECEC;
    transition: color 0.3s;
  }
  nav ul li:hover,
  nav ul li.active {
    color: #FF6D05;
  }
  .search {
    background: #22224A;
    border-radius: 25px;
    padding: 5px 15px;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 250px;
  }
  .search input {
    background: transparent;
    border: none;
    outline: none;
    color: #ECECEC;
    width: 100%;
    font-size: 0.9rem;
  }
  .search input::placeholder { color: #7777a7; }
  .search svg { fill: #9999CC; }
  .nav-icons {
    display: flex;
    gap: 15px;
  }
  .nav-icons a {
    display: flex;
    align-items: center;
  }
  .nav-icons svg {
    fill: #ECECEC;
    width: 22px;
    height: 22px;
    cursor: pointer;
    transition: fill 0.3s;
  }
  .nav-icons svg:hover { fill: #FF6D05; }

  /* Main */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .page-title {
    font-size: 2rem;
    font-weight: 700;
    margin: 30px 0 20px 0;
    color: #FF6D05;
  }
  
  /* Filters */
  .filters {
    margin-bottom: 30px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
  }
  .filter-group {
    background: #22224A;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.9rem;
    color: #ECECEC;
    cursor: pointer;
    transition: all 0.3s;
    border: none;
  }
  .filter-group:hover,
  .filter-group.active {
    background: linear-gradient(90deg, #FF6D05, #DB00FF);
  }
  
  /* Products Grid */
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 25px;
  }
  .product-card {
    background: #1B1B35;
    border-radius: 18px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 0 15px rgb(219 0 255 / 0.3);
    transition: transform 0.3s ease;
  }
  .product-card:hover {
    transform: translateY(-8px);
  }
  .product-img {
    width: 100%;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2B2B54;
    border-radius: 12px;
    overflow: hidden;
  }
  .product-img img {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
  }
  .product-name {
    font-weight: 700;
    font-size: 1.1rem;
    margin: 0;
  }
  .product-price {
    font-weight: 900;
    font-size: 1.4rem;
    color: #FF6D05;
    margin: 0;
  }
  .product-rating {
    color: #FFD700;
    font-size: 1.1rem;
  }
  .icon-button {
    background: linear-gradient(90deg, #FF6D05, #DB00FF);
    border: none;
    padding: 12px 20px;
    border-radius: 30px;
    color: white;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: auto;
  }
  .icon-button:hover {
    filter: brightness(1.2);
    transform: scale(1.02);
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: #9999CC;
    font-size: 1.2rem;
  }
  
  @media (max-width: 768px) {
    header { padding: 0 20px; }
    nav { display: none; }
    .search { width: 180px; }
    .filters { gap: 10px; }
    .filter-group { padding: 10px 16px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">SN<span>SHOP</span></a>
  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li class="active"><a href="productos.html">Productos</a></li>
      <li><a href="productos.html?oferta=true">Ofertas</a></li>
      <li><a href="productos.html?nueva=true">Novedades</a></li>
      <li><a href="nosotros.html">Nosotros</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>
  <form class="search" action="productos.html" method="get">
    <input type="text" placeholder="Buscar productos..." name="q" />
    <button type="submit" style="background:none;border:none;cursor:pointer;">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21.53 20.47l-4.825-4.825A7.944 7.944 0 0016 10a8 8 0 10-8 8 7.944 7.944 0 005.645-2.295l4.825 4.825a.75.75 0 001.06-1.06zM10 16a6 6 0 110-12 6 6 0 010 12z" fill="currentColor"/></svg>
    </button>
  </form>
  <div class="nav-icons">
    <a href="login.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-3-3.87"/><path d="M4 21v-2a4 4 0 013-3.87"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
    <a href="carrito.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.992 1.61H19a2 2 0 001.94-1.41L23 6H6"/></svg>
    </a>
  </div>
</header>

<main>
  <h1 class="page-title" id="page-title">Todos los productos</h1>
  
  <div class="filters">
    <button class="filter-group active" data-filter="todos">Todas</button>
    <button class="filter-group" data-filter="tecnologia">Tecnología</button>
    <button class="filter-group" data-filter="moda">Moda</button>
    <button class="filter-group" data-filter="deportes">Deportes</button>
    <button class="filter-group" data-filter="belleza">Belleza</button>
    <button class="filter-group" data-filter="hogar">Hogar</button>
    <button class="filter-group" data-filter="accesorios">Accesorios</button>
  </div>

  <section class="products-grid" id="products-grid">
    <!-- Productos se cargan desde JS -->
  </section>
  
  <div class="no-results" id="no-results" style="display: none;">
    No se encontraron productos con ese criterio de búsqueda.
  </div>
</main>

<script>
  // base de datos de productos
  const productosDB = [
    { id: "1", nombre: "Airpods Pro 2", precio: 159.99, categoria: "tecnologia", imagen: "img/airpods_pro.png", rating: 4 },
    { id: "2", nombre: "Smartwatch Series 8", precio: 129.99, categoria: "tecnologia", imagen: "img/Smartwatch.png", rating: 5 },
    { id: "3", nombre: "PlayStation 5", precio: 400.00, categoria: "tecnologia", imagen: "img/playstation.png", rating: 3 },
    { id: "4", nombre: "Camiseta Nike", precio: 29.99, categoria: "moda", imagen: "img/camiseta.png", rating: 4 },
    { id: "5", nombre: "Zapatillas Adidas", precio: 89.99, categoria: "moda", imagen: "img/zapatillas.png", rating: 5 },
    { id: "6", nombre: "Balón de Fútbol", precio: 19.99, categoria: "deportes", imagen: "img/balon.png", rating: 4 },
    { id: "7", nombre: "Raqueta Tenis", precio: 59.99, categoria: "deportes", imagen: "img/raqueta.png", rating: 4 },
    { id: "8", nombre: "Maquina Cremora", precio: 149.99, categoria: "belleza", imagen: "img/cremora.png", rating: 5 },
    { id: "9", nombre: "Lámpara LED", precio: 24.99, categoria: "hogar", imagen: "img/lampara.png", rating: 4 },
    { id: "10", nombre: "Reloj Apple", precio: 199.99, categoria: "accesorios", imagen: "img/reloj.png", rating: 5 },
  ];

  // Obtener parámetros de URL
  const params = new URLSearchParams(window.location.search);
  const categoryParam = params.get('cat');
  const ofertaParam = params.get('oferta');
  const nuevaParam = params.get('nueva');
  const queryParam = params.get('q');

  //渲染 estrellas
  function getStars(rating) {
    let stars = '';
    for (let i = 1; i <= 5; i++) {
      stars += i <= rating ? '★' : '☆';
    }
    return stars;
  }

  //渲染和产品
  function renderizarProductos(productos) {
    const grid = document.getElementById('products-grid');
    const noResults = document.getElementById('no-results');
    
    grid.innerHTML = '';
    
    if (productos.length === 0) {
      grid.style.display = 'none';
      noResults.style.display = 'block';
      return;
    }
    
    grid.style.display = 'grid';
    noResults.style.display = 'none';
    
    productos.forEach(producto => {
      const card = document.createElement('article');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="product-img">
          <img src="${producto.imagen}" alt="${producto.nombre}" onerror="this.src='img/zorro.png.png'"/>
        </div>
        <h3 class="product-name">${producto.nombre}</h3>
        <p class="product-price">$${producto.precio.toFixed(2)}</p>
        <div class="product-rating">${getStars(producto.rating)}</div>
        <button class="icon-button add-to-cart" data-id="${producto.id}">Agregar</button>
      `;
      grid.appendChild(card);
    });
    
    // Agregar eventos a botones
    document.querySelectorAll('.add-to-cart').forEach(btn => {
      btn.addEventListener('click', () => agregarAlCarrito(btn.dataset.id));
    });
  }

  // Agregar al carrito
  function agregarAlCarrito(id) {
    const producto = productosDB.find(p => p.id === id);
    if (!producto) return;
    
    let carrito = JSON.parse(localStorage.getItem('carritoSNShop')) || [];
    const existente = carrito.find(p => p.id === id);
    
    if (existente) {
      existente.cantidad++;
    } else {
      carrito.push({...producto, cantidad: 1});
    }
    
    localStorage.setItem('carritoSNShop', JSON.stringify(carrito));
    alert(`"${producto.nombre}" agregado al carrito!`);
  }

  // Filtrar productos
  function filtrar(categoria) {
    let filtrados = productosDB;
    
    if (categoria && categoria !== 'todos') {
      filtrados = productosDB.filter(p => p.categoria === categoria);
    }
    
    // Si hay búsqueda
    if (queryParam) {
      filtrados = productosDB.filter(p => 
        p.nombre.toLowerCase().includes(queryParam.toLowerCase())
      );
    }
    
    renderizarProductos(filtrados);
  }

  // Determinar título y filtro inicial
  let filtroActual = 'todos';
  const titulo = document.getElementById('page-title');
  
  if (categoryParam) {
    filtroActual = categoryParam;
    titulo.textContent = categoryParam.charAt(0).toUpperCase() + categoryParam.slice(1);
  } else if (ofertaParam) {
    titulo.textContent = '🔥 Ofertas Especiales';
  } else if (nuevaParam) {
    titulo.textContent = '✨ Nuevos Productos';
  } else if (queryParam) {
    titulo.textContent = `Resultados: "${queryParam}"`;
  } else {
    titulo.textContent = 'Todos los productos';
  }

  // Marcar filtro activo
  document.querySelectorAll('.filter-group').forEach(btn => {
    if (btn.dataset.filter === filtroActual) {
      btn.classList.add('active');
    }
    btn.addEventListener('click', () => {
      window.location.href = btn.dataset.filter === 'todos' 
        ? 'productos.html' 
        : `productos.html?cat=${btn.dataset.filter}`;
    });
  });

  // Inicializar
  filtrar(filtroActual);
</script>

</body>
</html>
